name: Deploy WalletService

on:
  push:
    branches: [main]
    paths:
      - 'swift-walletService/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/swift-walletservice:${{ github.sha }} ./swift-walletService

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/swift-walletservice:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy swift-walletservice \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/swift-walletservice:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="SPRING_PROFILES_ACTIVE=production"