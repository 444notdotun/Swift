name: Deploy NotificationService

on:
  push:
    branches: [main]
    paths:
      - 'swift-notificationService/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        working-directory: ./swift-notificationService
        run: ./mvnw test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/swift-notificationservice:${{ github.sha }} ./swift-notificationService

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gcr.io/${{ secrets.GCP_PROJECT_ID }}/swift-notificationservice:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/swift-notificationservice:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy swift-notificationservice \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/swift-notificationservice:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="SPRING_PROFILES_ACTIVE=production"